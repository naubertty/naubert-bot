[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greeplus"
version = "0.1.0"
description = "Controle local de ar-condicionado Gree/GREE+ (EWPE) a partir do PC, sem nuvem"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "naubert-bot" }]
keywords = ["gree", "ewpe", "air conditioner", "reverse engineering", "udp", "home-automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]

[project.scripts]
greeplus = "greeplus.cli:main"

[tool.setuptools]
packages = ["greeplus"]

[tool.setuptools.package-data]
greeplus = ["webui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
